<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container { text-align: center; z-index: 2; }

    /* Film strip animation */
    .film-strip {
      display: flex;
      gap: 6px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .frame {
      width: 32px; height: 24px;
      border: 2px solid #333;
      border-radius: 3px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      position: relative;
      animation: frameGlow 2s ease-in-out infinite;
    }
    .frame::before, .frame::after {
      content: '';
      position: absolute;
      width: 4px; height: 4px;
      background: #222;
      border-radius: 1px;
    }
    .frame::before { top: -6px; left: 50%; transform: translateX(-50%); }
    .frame::after { bottom: -6px; left: 50%; transform: translateX(-50%); }
    .frame:nth-child(1) { animation-delay: 0s; }
    .frame:nth-child(2) { animation-delay: 0.15s; }
    .frame:nth-child(3) { animation-delay: 0.3s; }
    .frame:nth-child(4) { animation-delay: 0.45s; }
    .frame:nth-child(5) { animation-delay: 0.6s; }
    .frame:nth-child(6) { animation-delay: 0.75s; }
    .frame:nth-child(7) { animation-delay: 0.9s; }

    @keyframes frameGlow {
      0%, 100% { border-color: #333; background: linear-gradient(135deg, #1a1a2e, #16213e); }
      50% { border-color: #7c3aed; background: linear-gradient(135deg, #2d1b69, #1e3a5f); box-shadow: 0 0 12px rgba(124,58,237,0.3); }
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4, #7c3aed);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    /* Loading bar */
    .loader-track {
      width: 200px;
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto 16px;
    }
    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      border-radius: 2px;
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .status {
      font-size: 11px;
      color: #666;
      min-height: 16px;
      transition: all 0.3s;
    }

    /* Error state */
    .error-container {
      display: none;
      text-align: left;
      max-width: 500px;
      width: 90%;
    }
    .error-container.visible { display: block; }
    .error-title {
      color: #ef4444;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-box {
      background: #1a0000;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: #fca5a5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
      -webkit-app-region: no-drag;
      user-select: text;
    }
    .error-hint {
      font-size: 10px;
      color: #666;
    }

    /* Background particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: #7c3aed;
      border-radius: 50%;
      opacity: 0;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0% { opacity: 0; transform: translateY(0) scale(0); }
      20% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
  </style>
</head>
<body>
  <!-- Background particles -->
  <div class="particles" id="particles"></div>

  <!-- Main content -->
  <div class="container" id="loadingView">
    <div class="film-strip">
      <div class="frame"></div>
      <div class="frame"></div>
      <div class="frame"></div>
      <div class="frame"></div>
      <div class="frame"></div>
      <div class="frame"></div>
      <div class="frame"></div>
    </div>
    <div class="title">AI-HUB</div>
    <div class="subtitle">AI-Powered Video Generation</div>
    <div class="loader-track"><div class="loader-bar"></div></div>
    <div class="status" id="status">Starting up...</div>
  </div>

  <!-- Error view (hidden by default) -->
  <div class="error-container" id="errorView">
    <div class="film-strip" style="margin-bottom:16px; opacity:0.3;">
      <div class="frame" style="border-color:#7f1d1d;animation:none;"></div>
      <div class="frame" style="border-color:#7f1d1d;animation:none;"></div>
      <div class="frame" style="border-color:#7f1d1d;animation:none;"></div>
    </div>
    <div class="error-title">Startup Failed</div>
    <div class="error-box" id="errorText">Unknown error</div>
    <div class="error-hint">
      Copy the error above and share it for debugging.<br>
      Close this window and try again, or use START.bat for more details.
    </div>
  </div>

  <script>
    // Generate random particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = (50 + Math.random() * 50) + '%';
      p.style.animationDelay = Math.random() * 4 + 's';
      p.style.animationDuration = (3 + Math.random() * 3) + 's';
      container.appendChild(p);
    }

    // Listen for status updates from main process
    if (window.electronAPI) {
      window.electronAPI.onSplashStatus((msg) => {
        document.getElementById('status').textContent = msg;
      });
      window.electronAPI.onSplashError((err) => {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('errorView').classList.add('visible');
        document.getElementById('errorText').textContent = err;
      });
    }
  </script>
</body>
</html>
